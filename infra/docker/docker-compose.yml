version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: devmate-postgres
    environment:
      POSTGRES_DB: devmate
      POSTGRES_USER: devmate
      POSTGRES_PASSWORD: devmate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmate -d devmate"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devmate-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: devmate-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devmate-network

  # MongoDB Document Database
  mongodb:
    image: mongo:7
    container_name: devmate-mongodb
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devmate-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: devmate-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devmate-network

  # Langfuse Observability
  langfuse:
    image: langfuse/langfuse:2.47.0
    container_name: devmate-langfuse
    environment:
      DATABASE_URL: postgresql://devmate:devmate@postgres:5432/langfuse
      NEXTAUTH_SECRET: devmate-langfuse-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000
      LANGFUSE_HOST: http://localhost:3000
      # Required by langfuse 2.x env validation; dev-only values
      SALT: devmate-langfuse-salt-change-in-production
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      # NOTE: langfuse 2.x has no env-based key seeding (that is a v3 feature).
      # One-time manual step: open http://localhost:3000, sign in with the
      # seeded user (devmate@localhost.dev / devmate-local-password), create a
      # project, and copy its API keys into devmate/.env as
      # LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY.
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devmate-network

  # DevMate API Service
  devmate-api:
    build:
      context: ..
      dockerfile: projects/04-ai-engineering/devmate/docker/Dockerfile
    container_name: devmate-api
    environment:
      APP_ENV: production
      DEBUG: "false"
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: devmate
      POSTGRES_USER: devmate
      POSTGRES_PASSWORD: devmate
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: devmate_code
      # Langfuse
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # LLM
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_LLM_PROVIDER: anthropic
      DEFAULT_MODEL: claude-3-5-sonnet-20241022
      # Embeddings
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSIONS: 1536
      # RAG
      RAG_TOP_K: 20
      RAG_RERANK_TOP_K: 5
      RAG_CHUNK_SIZE: 512
      RAG_CHUNK_OVERLAP: 50
      # Auth
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      # Rate limiting
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_WINDOW_SECONDS: 60
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - devmate-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # DevMate MCP Server
  devmate-mcp:
    build:
      context: ..
      dockerfile: projects/04-ai-engineering/devmate/docker/Dockerfile
    container_name: devmate-mcp
    command: python -m devmate.mcp.server http
    environment:
      APP_ENV: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: devmate
      POSTGRES_USER: devmate
      POSTGRES_PASSWORD: devmate
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSIONS: 1536
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - devmate-network

  # Streamlit UI
  devmate-ui:
    build:
      context: ..
      dockerfile: projects/04-ai-engineering/devmate/docker/Dockerfile
    container_name: devmate-ui
    command: streamlit run projects/04-ai-engineering/devmate/ui/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      DEVMATE_API_URL: http://devmate-api:8000
    ports:
      - "8501:8501"
    depends_on:
      - devmate-api
    networks:
      - devmate-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  mongodb_data:

networks:
  devmate-network:
    driver: bridge