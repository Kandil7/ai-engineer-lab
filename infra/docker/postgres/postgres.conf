# ============================================================
# PostgreSQL Configuration — Development Environment
# AI Engineer Lab
# ============================================================
# Mounted into the postgres container as custom config.
# Usage: docker compose up postgres
# ============================================================

# ──────────────────────────────────────────────
# Connections
# ──────────────────────────────────────────────
listen_addresses = '*'
port = 5432
max_connections = 100

# ──────────────────────────────────────────────
# Memory
# ──────────────────────────────────────────────
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 128MB

# ──────────────────────────────────────────────
# Write-Ahead Log (WAL)
# ──────────────────────────────────────────────
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
wal_buffers = 16MB

# ──────────────────────────────────────────────
# Query Planner
# ──────────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200

# ──────────────────────────────────────────────
# Logging (verbose for development)
# ──────────────────────────────────────────────
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 0
log_statement = 'all'
log_duration = on
log_line_prefix = '%m [%p] %u@%d '
log_lock_waits = on
log_temp_files = 0

# ──────────────────────────────────────────────
# Autovacuum (more aggressive for dev data)
# ──────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# ──────────────────────────────────────────────
# Timeouts (development-friendly)
# ──────────────────────────────────────────────
statement_timeout = 0
idle_in_transaction_session_timeout = 60000

# ──────────────────────────────────────────────
# Locale
# ──────────────────────────────────────────────
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
