# ============================================================
# Redis Configuration — Development Environment
# AI Engineer Lab
# ============================================================
# Mounted into the redis container as custom config.
# Usage: docker compose up redis
# ============================================================

# ──────────────────────────────────────────────
# Network
# ──────────────────────────────────────────────
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300

# ──────────────────────────────────────────────
# Authentication
# ──────────────────────────────────────────────
requirepass redis-dev-password

# ──────────────────────────────────────────────
# Memory
# ──────────────────────────────────────────────
maxmemory 128mb
maxmemory-policy allkeys-lru

# ──────────────────────────────────────────────
# Persistence
# ──────────────────────────────────────────────
# RDB snapshots
save 60 1000
save 300 100
save 900 10

# AOF (Append Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ──────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────
loglevel notice
logfile ""

# ──────────────────────────────────────────────
# Slow Log (for debugging)
# ──────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# ──────────────────────────────────────────────
# Clients
# ──────────────────────────────────────────────
maxclients 10000

# ──────────────────────────────────────────────
# Advanced (development defaults)
# ──────────────────────────────────────────────
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
