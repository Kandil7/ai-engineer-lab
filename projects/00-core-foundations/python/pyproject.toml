[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-foundations-python"
version = "0.1.0"
description = "Python Core Foundations - W3Schools Tutorial Exercises and Advanced Topics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Full Stack AI Engineer Lab", email = "lab@example.com"}
]
keywords = ["python", "education", "tutorial", "w3schools", "data-structures", "algorithms", "machine-learning", "web-frameworks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pymongo>=4.5",
    "mysql-connector-python>=8.1",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
django = [
    "django>=4.2",
    "djangorestframework>=3.14",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.11",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "isort>=5.12",
    "pre-commit>=3.4",
    "ipython>=8.14",
    "jupyter>=1.0",
]
docs = [
    "sphinx>=7.1",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2.0",
]
all = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.11",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "isort>=5.12",
    "pre-commit>=3.4",
    "ipython>=8.14",
    "jupyter>=1.0",
    "sphinx>=7.1",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2.0",
]

[project.urls]
Homepage = "https://github.com/fullstack-ai-engineer-lab/core-foundations-python"
Repository = "https://github.com/fullstack-ai-engineer-lab/core-foundations-python"
Issues = "https://github.com/fullstack-ai-engineer-lab/core-foundations-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.setuptools.package-dir]
"" = "."

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = "\\.pyi?$"
extend-exclude = """
practice_all.py
practice_no_solutions.py
"""

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "PIE", # flake8-pie
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function call in default argument
    "T201",  # print statement (allowed in tutorials)
    "PIE796", # redefinition of built-in (allowed in tutorials)
]
exclude = [
    "practice_all.py",
    "practice_no_solutions.py",
    "*.pyc",
    "__pycache__",
    ".venv",
    "venv",
]

[tool.ruff.per-file-ignores]
"*/__init__.py" = ["F401", "F403"]
"advanced/*.py" = ["T201"]
"django/*.py" = ["T201"]
"dsa/*.py" = ["T201"]
"fastapi/*.py" = ["T201"]
"ml/*.py" = ["T201"]
"numpy/*.py" = ["T201"]
"pandas/*.py" = ["T201"]
"scipy/*.py" = ["T201"]
"matplotlib/*.py" = ["T201"]
"mongodb/*.py" = ["T201"]
"mysql/*.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
exclude = [
    "practice_all.py",
    "practice_no_solutions.py",
    "*/venv/*",
    "*/.venv/*",
]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["practice_all.py", "practice_no_solutions.py"]

[tool.pydantic]
# For pydantic v2 config
extra = "ignore"