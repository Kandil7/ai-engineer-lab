# mypy configuration for the capstone src-layout (no packaging here).
# Run from this directory:  mypy src
[mypy]
python_version = 3.12
mypy_path = src
show_error_codes = True

# PyYAML ships no type stubs and installing types-PyYAML is out of scope:
# the yaml surface used here (safe_load of a small mapping) is covered by tests.
[mypy-yaml.*]
ignore_missing_imports = True
