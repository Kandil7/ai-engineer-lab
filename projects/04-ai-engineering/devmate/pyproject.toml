[project]
name = "devmate"
version = "0.1.0"
description = "AI assistant for code repositories - RAG + Agents + MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    # Floor at 1.9.0: fixes CVE-2024-3829 (qdrant input validation, GHSA-7m75-x27w-r52r).
    # Cap at <1.13: the server in infra/docker/docker-compose.yml is qdrant 1.8.0,
    # and client >=1.13 removed the .search() API vector_store.py relies on.
    "qdrant-client>=1.9.0,<1.13",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    "langfuse>=2.0.0",
    "tenacity>=8.3.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "tiktoken>=0.7.0",
    "streamlit>=1.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
# Evaluation harness (week 2-3). ragas is heavy and optional; the core harness
# in devmate/eval/ runs without it (pure-python metrics). Install with:
#   pip install -e ".[eval]"
eval = [
    "ragas>=0.2.0",
    "langsmith>=0.1.0",
]
# Agents + MCP (weeks 5-6). langgraph is optional — the hand-rolled ReAct loop
# is the primary implementation and runs without it.
agents = [
    "langgraph>=0.1.0",
    # Cap at <2.0: mcp/server.py uses the 1.x Tool(inputSchema=...) API;
    # mcp 2.x renamed it to input_schema. Don't bump one side without the other.
    "mcp>=1.0.0,<2.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "T20", "SIM", "RET", "ARG"]
ignore = ["S101", "ARG001", "ARG002"]
extend-ignore = [
    "D100", "D101", "D102", "D103", "D104", "D107",
    "ANN001", "ANN002", "ANN003",
    "ANN201", "ANN202", "ANN401",
    "E501",
    "SIM105",
]

[tool.ruff.lint.mccabe]
max-complexity = 15


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# 3.12, not 3.11: numpy 2.5.3 ships stubs using the 3.12-only `type`
# statement, so mypy cannot parse them under a 3.11 target at all
# (not suppressible via overrides). Revisit on a numpy upgrade.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false
disable_error_code = [
    "attr-defined",
    "override",
    "no-any-return",
    "var-annotated",
    "return-value",
    "arg-type",
  "misc",
  "abstract",
  "call-overload",
  "union-attr",
  "assignment",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: requires docker services (Qdrant/Redis/Postgres)",
    "llm: requires a real LLM API key (never run in CI)",
]

[project.scripts]
devmate = "devmate.cli.main:app"