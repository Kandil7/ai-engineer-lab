name: CI

# Scope note (updated 2026-10-06):
# This pipeline gates the DevMate service, the workspace registry system
# (tests/*/validate.ps1 on windows-latest), the docs gates, and the legacy
# curriculum under projects/00-core-foundations/python/. The curriculum suite
# was repaired (previously 2 collection errors and 68 failures from
# directory-name shadowing); it now gates like every other job.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  devmate:
    name: DevMate — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/04-ai-engineering/devmate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: projects/04-ai-engineering/devmate/pyproject.toml

      - name: Install dependencies
        # pip from the PEP 621 pyproject is the environment of record
        # (see Makefile). No lockfile is committed; see current-focus.md.
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Format check (ruff format)
        run: python -m ruff format --check .

      - name: Type check (mypy)
        run: python -m mypy src/

      - name: Tests
        run: python -m pytest -q --cov=devmate --cov-report=term-missing
        env:
          # Unit tests must not call a real API. Integration tests are marked
          # and excluded here; they run in the integration job below.
          ANTHROPIC_API_KEY: test-key-not-used

  workspace:
    name: Workspace — .ai registry validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run registry validators
        # Gates tests/*/validate.ps1: prompt/workflow/template inventories,
        # their cross-registry consistency, and the repo structure.
        shell: pwsh
        run: |
          $suites = @("prompts", "workflows", "templates", "registries", "repo-structure")
          $failed = $false
          foreach ($suite in $suites) {
            & "tests/$suite/validate.ps1"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

  integration:
    name: DevMate — integration (Qdrant + Redis)
    runs-on: ubuntu-latest
    # Enabled from week 2, once the vector store exists.
    if: false
    defaults:
      run:
        working-directory: projects/04-ai-engineering/devmate

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m integration
        env:
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379

  docs:
    name: Docs — link and structure validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken relative links in docs/
        run: |
          fail=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            grep -oE '\]\([^)#][^)]*\.md[^)]*\)' "$file" 2>/dev/null \
              | sed -E 's/^\]\(//; s/\)$//; s/#.*$//' \
              | while read -r link; do
                  case "$link" in http*) continue ;; esac
                  target="$dir/$link"
                  if [ ! -f "$target" ]; then
                    echo "::error file=$file::broken link -> $link"
                    exit 1
                  fi
                done || fail=1
          done < <(find docs -name '*.md' -not -path 'docs/plan/archive/*')
          exit $fail

      - name: Tracking freshness
        # current-focus.md must be updated weekly. It went five weeks stale
        # under the previous plan; this makes staleness visible.
        run: |
          file=docs/tracking/current-focus.md
          stamp=$(grep -oE '\*\*Last updated:\*\* [0-9]{4}-[0-9]{2}-[0-9]{2}' "$file" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          if [ -z "$stamp" ]; then
            echo "::error::no 'Last updated:' stamp found in $file"
            exit 1
          fi
          age=$(( ( $(date +%s) - $(date -d "$stamp" +%s) ) / 86400 ))
          echo "current-focus.md is $age day(s) old (stamped $stamp)"
          if [ "$age" -gt 8 ]; then
            echo "::error::$file is $age days old — update it (weekly review)"
            exit 1
          fi

  legacy-lint:
    name: Legacy curriculum — tests (lint advisory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/00-core-foundations/python

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff pytest
      - name: Lint (advisory)
        # ~2.3k style findings (I001/E402/N806...) across teaching files;
        # modernizing them is deferred churn. Tests below are the gate.
        run: ruff check . --statistics || true
      - name: Tests
        run: pytest -q
