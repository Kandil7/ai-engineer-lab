# Knowledge Registry - concept graph for the AI Engineer Lab "Learning OS".
# The backbone that links a concept to where it is taught, its source, its
# exercise, the project that uses it, and the evidence that proves mastery.
# Read by tests/knowledge/validate.ps1 and by the
# learning/project-to-learning-map workflow.
#
# Schema per node:
#   id                 unique dotted id (domain.area)
#   name               human-readable name
#   level              core | advanced
#   prerequisites      list of node ids (must resolve in this file)
#   taught_in          repo-relative paths (files or dirs) that must exist
#   sources            learning-sources/source-index.md anchors (source-index#N)
#   exercises          repo-relative paths (files or dirs) that must exist
#   used_by_projects   repo-relative project paths that must exist
#   evidence           one-line proof of mastery
#   status             active | deprecated
version: 1
domains:
  python:
    - id: python.production
      name: Production Python
      level: core
      prerequisites: []
      taught_in: [projects/00-core-foundations/python/02-advanced-python/35-unicode-and-arabic-text]
      sources: [source-index#1]
      exercises: [projects/00-core-foundations/python/02-advanced-python/challenges]
