# Prompt Registry — inventory, ownership, and versioning for all .ai/prompts
# Schema: id, path, owner, version, status, layer, used_by (workflows), constraints, trigger (repair only), last_reviewed
# used_by accepts workflow ids (feature/01-plan), category globs (learning/*),
# or prefix globs (debugging/*). Repair entries leave used_by empty and declare
# a trigger instead. Deprecated entries are unreferenced by design.
version: 1
prompts:
  # --- system ---
  - id: sys.workspace-governor
    path: .ai/prompts/system/workspace-governor.md
    owner: workspace
    version: 1.0.0
    status: active
    layer: system
    used_by: [feature/*, debugging/*, learning/*, architecture/*, evaluation/*]
    constraints: [repo-first, no-invented-scope, mvp-first]
    last_reviewed: 2026-06-26
  - id: sys.output-format-rules
    path: .ai/prompts/system/output-format-rules.md
    owner: workspace
    version: 1.0.0
    status: active
    layer: system
    used_by: [feature/*, debugging/*, learning/*, architecture/*, evaluation/*]
    constraints: [bounded, anti-hallucination]
    last_reviewed: 2026-06-26

  # --- roles ---
  - id: role.learning-coach
