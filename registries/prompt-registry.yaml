  # --- repair (escalation paths; composed on failure, not bound to a workflow) ---
  - id: repair.retry-with-missing-context
    path: .ai/prompts/repair/retry-with-missing-context.md
    owner: workspace
    version: 1.0.0
    status: active
    layer: repair
