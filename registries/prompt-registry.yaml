    version: 1.0.0
    status: active
    layer: role
    used_by: [feature/03-build, feature/05-fix]
    constraints: [step-by-step, wait-for-confirmation, hints-before-code]
    last_reviewed: 2026-06-26
  - id: role.code-reviewer
    path: .ai/prompts/roles/code-reviewer.md
    owner: workspace
    version: 1.0.0
    status: active
    layer: role
    used_by: [feature/04-review]
    constraints: [severity-required, no-rewrite-by-default, cite-exact-files]
    last_reviewed: 2026-06-26
  - id: role.debugging-specialist
    path: .ai/prompts/roles/debugging-specialist.md
    owner: workspace
    version: 1.0.0
    status: active
    layer: role
    used_by: [debugging/*]
    constraints: [rank-hypotheses-before-fix, require-evidence, no-premature-conclusion]
    last_reviewed: 2026-06-26
  - id: role.source-learning-agent
    path: .ai/prompts/roles/source-learning-agent.md
    owner: workspace
    version: 1.0.0
    status: active
    layer: role
    used_by: [learning/*]
    constraints: [source-grounded, separate-confirmed-vs-inferred, link-to-project]
    last_reviewed: 2026-06-26
  - id: role.principal-system-designer
    path: .ai/prompts/roles/principal-system-designer.md
    owner: workspace
    version: 1.0.0
    status: active
    layer: role
    used_by: [architecture/*, evaluation/*]
    constraints: [no-code, scale-aware, tradeoff-explicit]
    last_reviewed: 2026-06-26

  # --- tasks ---
  - id: task.feature-builder
